name: Add Homework 3 BankMarketing dataset

on:
  push:
    paths:
      - '.github/workflows/add-homework3-bank-dataset.yml'

permissions:
  contents: write

jobs:
  add-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Bank Marketing dataset
        run: |
          python - <<'PY'
          import urllib.request, zipfile, pathlib
          url = "https://archive.ics.uci.edu/static/public/222/bank+marketing.zip"
          zip_path = pathlib.Path("/tmp/bank_marketing.zip")
          urllib.request.urlretrieve(url, zip_path)
          with zipfile.ZipFile(zip_path) as z:
              matches = [n for n in z.namelist() if n.endswith("bank-additional-full.csv")]
              if not matches:
                  raise RuntimeError("bank-additional-full.csv not found in archive")
              data = z.read(matches[0])
          out = pathlib.Path("Homework3/dataset/BankMarketing/bank-additional-full.csv")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          PY

      - name: Commit dataset
        run: |
          rm .github/workflows/add-homework3-bank-dataset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Homework3/dataset/BankMarketing/bank-additional-full.csv .github/workflows/add-homework3-bank-dataset.yml
          git commit -m "Add Homework 3 BankMarketing full dataset"
          git push
